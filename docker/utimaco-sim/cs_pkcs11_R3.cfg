# ==============================================================================
# Utimaco SecurityServer / PaymentServer v6.6.0.0 PKCS#11 R3 Configuration File
# En producción solo se actualiza la sección [HSMCluster] Devices con la IP del
# HSM físico (ej. Devices = 288@10.20.30.40 o cluster { 288@10.20.30.40 288@10.20.30.41 })
# ==============================================================================

[Global]
Logging = 1
Logpath = /tmp
Logsize = 10mb

SlotMultiSession = true
SlotLoginRestriction = true
SlotCount = 10
KeepLeadZeros = false
FallbackInterval = 0
KeepAlive = true
ConnectionTimeout = 5000
CommandTimeout = 60000
KeysExternal = false

[HSMCluster]
Devices = 3015@utimaco-sim
