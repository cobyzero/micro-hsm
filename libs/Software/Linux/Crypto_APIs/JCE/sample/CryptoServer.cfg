# Configuration File for JCE CryptoServer Provider
# Note: only slash (/) and double backslash (\\) are accepted in paths. Single backslashes are accepted for multiline support.
 
# LogFile = C:/<user directory>/CryptoServerJCE.log
# LogLevel = 2
# LogSize = 10000

# exemplary device specifier
# Device = 192.168.4.183
# Device = PCI:0
# Device = /dev/cs2.0
# Device = /dev/cs2.0.1
Device = 3001@127.0.0.1

# exemplary cluster configuration:
# Device = PCI:0 \
#         192.168.4.183 \
#         192.168.4.185 \
#         192.168.4.186

# exemplary device configuration over TLS:
# Device = TLS:4001@194.168.4.107

ConnectionTimeout = 3000
Timeout = 30000
EndSessionOnShutdown = 1
KeepSessionAlive = 0

DefaultUser = JCE
